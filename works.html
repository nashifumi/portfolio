
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Works — 梨 文</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #ffffff;
  color: #20211f;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

header {
  padding: 25px 4%;
  border-bottom: 1px solid #ddd;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-family: Georgia, serif;
  font-size: 25px;
  font-style: italic;
}

header a {
  color: inherit;
  text-decoration: none;
  font-size: 11px;
  letter-spacing: .15em;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 65px 4%;
}

h1 {
  font-family: Georgia, serif;
  font-size: 55px;
  font-weight: normal;
  margin: 0 0 12px;
}

.subtitle {
  color: #777;
  font-size: 11px;
  letter-spacing: .15em;
  margin-bottom: 45px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.gallery img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  cursor: pointer;
  transition: opacity .3s;
}

.gallery img:hover {
  opacity: .75;
}

#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.92);
  z-index: 10;
  justify-content: center;
  align-items: center;
  padding: 30px;
  cursor: pointer;
}

#lightbox img {
  max-width: 95%;
  max-height: 90vh;
  object-fit: contain;
}

#close {
  position: absolute;
  top: 20px;
  right: 25px;
  color: white;
  font-size: 32px;
}

footer {
  text-align: center;
  padding: 40px;
  font-size: 10px;
  color: #777;
}

@media (max-width: 650px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  main {
    padding-top: 45px;
  }

  h1 {
    font-size: 42px;
  }
}
</style>
</head>

<body>

<header>
  <a class="logo"href="index.html">梨 文</a>
  </header>

<main>
  <h1>Works</h1>
  <p class="subtitle">
    SELECTED WORKS / 2024 — 2026
  </p>

  <div class="gallery">
    <img src="./IMG_8581.png" alt="Artwork 01" alt="Artwork 01">
    <img src="./IMG_8583.png" alt="Artwork 01" alt="Artwork 02">
    <img src="./IMG_8612.png" alt="Artwork 01" alt="Artwork 03">
    <img src="./IMG_8613.png" alt="Artwork 01" alt="Artwork 04">
    <img src="./IMG_8638.png" alt="Artwork 05">
    <img src="./イラスト148.png" alt="Artwork 06">
  </div>
</main>

<div id="lightbox">
  <span id="close">×</span>
  <img id="largeImage" src="" alt="拡大作品">
</div>

<footer>
  © 2026 梨 文. ALL RIGHTS RESERVED.
</footer>

<script>
const images = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const largeImage = document.getElementById("largeImage");

images.forEach(img => {
  img.addEventListener("click", () => {
    largeImage.src = img.src;
    lightbox.style.display = "flex";
  });
});

lightbox.addEventListener("click", () => {
  lightbox.style.display = "none";
});
</script>

</body>
</html>
